const ST=[
{n:'수성',c:'#b9aaa0',R:36,k:2,g:0,b:15,h:'가장 빠른 술래들! 대시로 따돌리세요'},

{n:'토성',c:'#e6d3a0',R:52,k:4,g:.4,ring:1,h:'고리 안은 느려져요 · 핑크 블랙홀은 빨아들여요'},
{n:'천왕성',c:'#7fe0e6',R:46,k:4,g:0,rev:1,h:'주기적으로 조작이 반전돼요!'},
{n:'해왕성',c:'#3a5fe0',R:46,k:4,g:.15,w:1,sm:.85,h:'바람이 술래를 더 크게 밀어내요! 순풍을 타세요'},

{n:'히든 III · 붉은 태양',c:'#ffb02e',R:80,k:0,g:0,boss:1,bk:'h3',hp:6,sun:1,h:'……태양이 너무 약하다. 정말 이게 끝일까?'}];

const SY=['"태양이 조용해진 지 오래야. 가장 가까운 수성부터 가보자. …저기, 그림자들이 쫓아와!"','구름 속에서 속삭임이 들려요. "쟤네는 널 해치려는 게 아니야… 그냥 외로운 거야."','달이 말해요. "그림자는 태양이 잊지 못한 기억들이야. 붙잡히면 마음이 차가워져."','모래바람 사이로 오래된 기록이 보여요. 태양과 별똥별 루미는 매일 밤 술래잡기를 했대요.','소행성대의 수호자 케레스가 깨어났어요. 대시로 부딪히거나, 황금 구슬로 술래가 되어 다가가세요.','거대한 목성이 낮게 웃어요. "가장 오래 지켜본 건 나야. 태양은 널 기다리고 있어."','고리가 노래해요. 한 번도 닫히지 않은 문처럼, 태양은 문을 열어 두고 있었대요.','모든 게 뒤집힌 세계. 하지만 마음만은 똑바로. 도망치는 게 아니라, 다가가는 거야.','차가운 바람이 등을 떠밀어요. "이제 거의 다 왔어, 루미."','"…누구야? 오지 마!" 태양이 외로움에 떨며 빛을 뿜어요. 그의 곁으로 다가가 달래 주세요.','수성의 메아리 속에서 지금까지의 그림자들이 다시 깨어나요. 7분을 버텨요.','별들의 시련. 모든 행성의 규칙이 당신을 시험해요.','약해진 태양 곁에서, 아주 오래된 붉은 빛이 눈을 뜨려 해요…'];
const EN=['그림자들이 천천히 멈춰 섰다.<br>쫓아오던 것이 아니었다.<br>그저, 누군가 곁에 있어 주길 바랐을 뿐.','루미는 도망치기를 멈추고<br>가장 큰 그림자에게 다가갔다.<br><b>"잡았다."</b><br>작은 손이 닿는 순간, 차가운 어둠이 따뜻한 빛으로 번졌다.','"…기다렸어. 아주 오래."<br>태양의 목소리는 떨리고 있었다.<br>"이번엔 내가 술래할게. 우리, 계속 놀자."','그날 밤, 태양계의 모든 행성이 다시 반짝이기 시작했다.<br>부르면 대답하는 곳.<br>돌아올 곳이 있다는 건, 이렇게 따뜻한 일이었다.'];

const K='solartag1';let DB={u:{},c:''},ei=0,rm=1,rf=1,wo={x:0,y:0,t:0};
try{DB=JSON.parse(localStorage.getItem(K))||DB}catch(e){}
let U=DB.u[DB.c]||null;
function mig(u){mig2(u);u.st=u.st||[];u.bs=u.bs||[];while(u.st.length<13)u.st.push(0);while(u.bs.length<13)u.bs.push(0);u.hs=u.hs||Array(10).fill(0);u.hb=u.hb||Array(10).fill(0);u.opt=u.opt||{pr:0,one:0,beg:0,dl:1};if(u.opt.dl==null)u.opt.dl=1;if(u.un>4)u.belt=1}
function tuser(){const u={h:'',un:1,st:[],bs:[],t:0,end:1,hcall:1,belt:1,opt:{pr:1,one:0,beg:0,dl:1}};mig(u);return u}
if(U)mig(U);let O=U?U.opt:{pr:0,one:0,beg:0,dl:1};if(U&&U.lt)document.body.classList.add('lt');let sm=0;

const hs=q=>{let h=5381;for(const c of q)h=h*33^c.charCodeAt(0);return(h>>>0).toString(36)};
function ovh(h){const o=$('ov');o.className='';o.innerHTML=`<div class="pn">${h}</div>`}
function ov(t,b,btn,fn,b2,f2){ovh(`<h1>${t}</h1><div>${b}</div><button id="ob">${btn}</button>${b2?`<button id="o2" class="sc">${b2}</button>`:''}`);$('ob').onclick=()=>{$('ov').className='h';fn()};if(b2)$('o2').onclick=()=>{$('ov').className='h';f2()}}
function title(){cfg=null;sc='menu';if(U)return chsel();
 ovh(`<div class="lg">☄️</div><h1 class="tt">태양계 술래잡기</h1><div class="sb">잃어버린 친구를 찾아서</div><div class="fm"><input id="nm" placeholder="닉네임" maxlength="10" value="${DB.c||''}"><input id="pw" type="password" inputmode="numeric" maxlength="4" placeholder="PIN 4자리"><button id="lg">시작 / 로그인</button><div id="er"></div></div><small>처음 입력하면 계정이 만들어져요<br>진행 상황은 이 기기에 저장돼요</small>`);
 $('lg').onclick=login;$('pw').onkeydown=e=>{if(e.key=='Enter')login()}}
function login(){const n=$('nm').value.trim(),w=$('pw').value;if(!n||!/^\d{4}$/.test(w)){$('er').textContent='닉네임과 숫자 4자리 PIN을 입력하세요';return}
 if(n==TN){if(w!=TP){$('er').textContent='PIN이 달라요';return}TA=1;U=tuser();O=U.opt;sm=0;chsel();return}
 let u=DB.u[n],nw=0;if(!u){nw=1;u=DB.u[n]={h:hs(w+n),un:1,st:Array(10).fill(0),bs:Array(10).fill(0),t:0,end:0}}else if(u.h!==hs(w+n)){$('er').textContent='PIN이 달라요';return}
 U=u;mig(U);O=U.opt;DB.c=n;sv();nw?prol():chsel()}

function sel(){if(CH==2)return sel2();cfg=null;sc='menu';document.body.classList.toggle('lt',!!U.lt);
 if(sm==1&&!U.end||sm==2&&!U.hcall)sm=0;
 const ids=sm==2?[10,11,12]:ST.map((_,i)=>i).filter(i=>i<10&&(U.belt||i!=4)),A=sm==1?U.hs:U.st,B=sm==1?U.hb:U.bs;let g='',n=0;
 ids.forEach(i=>{const s=ST[i];n++;const lk=TA?0:sm==0?i>=U.un:sm==2?i>10&&!U.st[i-1]:0,sr=A[i]||0;g+=`<div class="cd${lk?' lk':''}" data-i="${i}"><div class="pl" style="background:radial-gradient(circle at 35% 30%,#fff,${s.c} 40%,#111)"></div><b>${sm==2?'':n+'. '}${s.n.split(' · ')[0]}</b><span>${lk?'🔒':'★'.repeat(sr)+'☆'.repeat(3-sr)}</span><small>${B[i]?B[i]+'점':'&nbsp;'}</small></div>`});

 ovh(`<h1>스테이지 선택</h1><div>${TA?TN+' (테스트)':DB.c} 님 · 총 플레이 ${fmt(U.t)}${O.pr?' · 연습':''}${O.one?' · 한 생명':''}${O.beg?' · 거지':''}</div>${U.end?tb:''}<div class="gr">${g}</div><button id="op" class="sc">⚙ 옵션</button><button id="cs" class="sc">챕터 선택</button><button id="lo" class="sc">로그아웃</button>${U.end&&!TA?'<button id="e2" class="sc">엔딩 다시 보기</button>':''}${U.lt&&!TA?'<button id="e3" class="sc">진엔딩 다시 보기</button>':''}`);
