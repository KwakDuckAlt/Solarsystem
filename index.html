 $('lg').onclick=login;$('pw').onkeydown=e=>{if(e.key=='Enter')login()}}
function login(){const n=$('nm').value.trim(),w=$('pw').value;if(!n||!/^\d{4}$/.test(w)){$('er').textContent='닉네임과 숫자 4자리 PIN을 입력하세요';return}
